# kivotos host settings. install.sh copies this to /etc/kivotos/config.toml on the first run (never overwrites it).
# After changing `backend`, `schedule`, `randomized_delay`, `repository` or a source `path`, run:  sudo kivotos units

# "restic": kivotos copies each service into a restic repo on its own timer (everything below applies).
# "zfs": the sources sit on ZFS and sanoid snapshots them; kivotos only runs dumps and hooks around
#        each snapshot (see README, "ZFS backend"). repository, password_file, schedule and retention
#        are then unused, and `exclude`/`stop` do nothing.
backend = "restic"

repository    = "/tank/backups/kivotos"   # a local path, or any restic repo URL (sftp:, s3:, rest:, ...)
password_file = "/etc/kivotos/password"
cache_dir     = "/var/cache/kivotos"

# systemd OnCalendar syntax (check one with: systemd-analyze calendar '...'). A missed run happens after boot.
schedule         = "*-*-* 04:30"
randomized_delay = "15m"

# Hooks, dumps and podman commands run as this user, never as root. install.sh fills in whoever ran sudo.
# A [[source]] can set its own `user` (see README, "Several users").
user = "your-user"

# zfs backend: sanoid snapshot types that also run the [[dump]]s (hooks run on every snapshot)
[zfs]
dump_on = ["daily"]

# zfs backend: copy sanoid's snapshots to another pool (see README, "Replication"). As many as you like.
# [[zfs.replicate]]
# from     = "rpool"
# to       = "backup/rpool"
# exclude  = ["rpool/var/cache"]
# schedule = "hourly"
# before   = []            # shell commands run as root first

# Kept per service (per backed-up path); everything older is pruned
[retention]
daily   = 7
weekly  = 4
monthly = 6

# Every directory directly inside `path` is a service and gets its own snapshot.
# A service's own rules go in <path>/<service>/kivotos.toml (see README).
[[source]]
name    = "containers"
path    = "~/Containers"   # ~ is the home of this source's user, not root's
exclude = []   # applied inside every service of this source, same syntax as the per-service exclude
