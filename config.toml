# kivotos host settings. install.sh copies this to /etc/kivotos/config.toml on the first run (never overwrites it).
# After changing `schedule`, `randomized_delay`, `repository` or a source `path`, run:  sudo kivotos units

repository    = "/tank/backups/kivotos"   # a local path, or any restic repo URL (sftp:, s3:, rest:, ...)
password_file = "/etc/kivotos/password"
cache_dir     = "/var/cache/kivotos"

# systemd OnCalendar syntax (check one with: systemd-analyze calendar '...'). A missed run happens after boot.
schedule         = "*-*-* 04:30"
randomized_delay = "15m"

# Hooks, dumps and podman commands run as this user, never as root. install.sh fills in whoever ran sudo.
user = "your-user"

# Kept per service (per backed-up path); everything older is pruned
[retention]
daily   = 7
weekly  = 4
monthly = 6

# Every directory directly inside `path` is a service and gets its own snapshot.
# A service's own rules go in <path>/<service>/kivotos.toml (see README).
[[source]]
name    = "containers"
path    = "~/Containers"   # ~ is the home of `user`, not root's
exclude = []   # applied inside every service of this source, same syntax as the per-service exclude
